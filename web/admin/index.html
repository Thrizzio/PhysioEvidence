<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhysioEvidence Ingestion</title><link rel="stylesheet" href="styles.css">
</head>
<body data-api-base="http://localhost:8001">
  <main class="shell">
    <p class="eyebrow">Private administration</p>
    <h1>Ingest evidence documents.</h1>
    <p class="intro">This page is for the corpus owner. Upload PDFs, inspect terminal job states, and monitor original-file storage usage.</p>
    <section class="card">
      <label for="token">Admin token</label>
      <input id="token" type="password" autocomplete="off" placeholder="Bearer token configured on the service">
      <label for="files">PDF documents</label>
      <input id="files" type="file" accept="application/pdf,.pdf" multiple>
      <button id="upload" type="button">Validate and index PDFs</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section class="card"><div class="section-heading"><h2>Corpus documents</h2><button id="refresh" type="button" class="secondary">Refresh</button></div><div id="usage"></div><div id="documents"></div></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
